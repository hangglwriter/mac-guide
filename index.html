<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>민티의 맥북 & 클로드코드 가이드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #42b983;
      --sidebar-width: 260px;
    }
    .sidebar-nav li a {
      font-size: 14px;
    }
    .markdown-section {
      max-width: 800px;
    }
    /* 카테고리 아이콘 */
    .sidebar-nav li a[href*="mac/"]::before { content: "💻 "; }
    .sidebar-nav li a[href*="terminal/"]::before { content: "⬛ "; }
    .sidebar-nav li a[href*="claude-code/"]::before { content: "🤖 "; }
    .sidebar-nav li a[href*="git/"]::before { content: "🔀 "; }
    .sidebar-nav li a[href*="log/"]::before { content: "📅 "; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '민티의 맥북 가이드',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: '검색어 입력...',
        noData: '결과가 없습니다',
        paths: 'auto'
      },
      auto2top: true,
      coverpage: false
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
